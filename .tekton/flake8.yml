apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to flake8
      type: array
      default: ["--count", "--max-complexity=10", "--max-line-length=127", "--statistics"]
  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      command: ["/bin/sh", "-c"]
      args:
        - |
          python -m pip install --upgrade pip && pip install flake8 && flake8 service "$@"
        - --
        - $(params.args[*])